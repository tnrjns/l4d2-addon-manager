name: Build Windows EXE

on:
  push:
    tags:
      - "v*"          # building + publishing a release happens on version tags
  workflow_dispatch:   # also lets you trigger a build manually from the Actions tab

permissions:
  contents: write      # needed so the workflow can create the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: >
          python -m PyInstaller --onefile --windowed
          --name "L4D2AddonManager"
          --collect-all customtkinter
          l4d2_addon_manager.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: L4D2AddonManager
          path: dist/L4D2AddonManager.exe

      - name: Attach EXE to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/L4D2AddonManager.exe
          generate_release_notes: true
